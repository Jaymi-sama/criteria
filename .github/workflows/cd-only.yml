name: Standalone CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment immediately..."
          # Example for Vercel:
          # pnpm dlx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
          # Example for Netlify:
          # pnpm dlx netlify-cli deploy --dir=out --prod --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}
          echo "Deployment step completed (Placeholder)."
